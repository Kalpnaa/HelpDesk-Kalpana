<div class="login-container">
  <div class="login-card">

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your HelpDesk account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <small *ngIf="loginForm.get('email')?.touched &&
                      loginForm.get('email')?.hasError('required')">
          Email is required.
        </small>

        <small *ngIf="loginForm.get('email')?.touched &&
                      loginForm.get('email')?.hasError('email')">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
        />

        <small *ngIf="loginForm.get('password')?.touched &&
                      loginForm.get('password')?.hasError('required')">
          Password is required.
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Signing In...' : 'Sign In' }}
      </button>

    </form>

    <p class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Sign Up</a>
    </p>

  </div>
</div>
