<div class="register-container">
  <div class="register-card">

    <h2>Create Your Account</h2>
    <p class="subtitle">Join HelpDesk to get support</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          id="fullName"
          type="text"
          formControlName="fullName"
          placeholder="Enter your full name"
        />

        <small *ngIf="registerForm.get('fullName')?.touched &&
                      registerForm.get('fullName')?.hasError('required')">
          Full name is required.
        </small>
        <small *ngIf="registerForm.get('fullName')?.touched &&
                      registerForm.get('fullName')?.hasError('minlength')">
          Name must contain at least 2 characters.
        </small>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <small *ngIf="registerForm.get('email')?.touched &&
                      registerForm.get('email')?.hasError('required')">
          Email is required.
        </small>
        <small *ngIf="registerForm.get('email')?.touched &&
                      registerForm.get('email')?.hasError('email')">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Create a password"
        />

        <small *ngIf="registerForm.get('password')?.touched &&
                      registerForm.get('password')?.hasError('required')">
          Password is required.
        </small>
        <small *ngIf="registerForm.get('password')?.touched &&
                      registerForm.get('password')?.hasError('minlength')">
          Password must contain at least 8 characters.
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>

    </form>

    <p class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>
</div>
